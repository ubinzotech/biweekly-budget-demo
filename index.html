<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biweekly Paycheck Budget Planner — Shop by Wrenly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FAF6EF; --card:#FFFDF9; --border:#E8DCC8; --tint:#F3EBDD;
  --accent:#7C8B6F; --accent2:#8A9B7E; --accent-soft:#DEE5DD;
  --head:#2B2620; --body:#5C5548; --muted:#8A7F6A;
  --teal:#0CA9B5; --green:#5E8C5A; --red:#C05A44;
  --input:#FFFFFF; --shadow:rgba(43,38,32,.08);
}
/* ---- Dark mode: warm dark palette, toggled from Settings > Appearance ---- */
[data-theme="dark"]{
  --bg:#211C16; --card:#2C2620; --border:#453D31; --tint:#362E25;
  --head:#F2EBDD; --body:#CFC5B2; --muted:#9A8F7A;
  --teal:#3EC6D2; --green:#7FB573; --red:#E07A5F;
  --input:#332C24; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-theme="dark"] nav.pills button.active,[data-theme="dark"] .filter-tabs button.active,[data-theme="dark"] .pill.sage,[data-theme="dark"] .pal-item.sel,[data-theme="dark"] .icon-opt.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="dark"] .pal-item.sel .k{color:rgba(255,255,255,.75)}
[data-theme="dark"] .cal-day.selected{background:var(--accent);border-color:var(--accent)}
[data-theme="dark"] .cal-day.selected .dow,[data-theme="dark"] .cal-day.selected .dnum,[data-theme="dark"] .cal-day.selected .bill{color:#fff}
[data-theme="dark"] .btn2:hover{background:#453D31}
[data-theme="dark"] .btn-dark{background:var(--head);color:var(--bg)}
[data-theme="dark"] .btn-danger{background:#4A2A22}
[data-theme="dark"] .btn-danger:hover{background:#5A322A}
[data-theme="dark"] .pill.due{background:#4A2A22}
[data-theme="dark"] .pill.paid{background:#2C3D2A}
[data-theme="dark"] .pill.teal{background:#123B40;color:#3EC6D2}
[data-theme="dark"] .notice{background:#123B40;border-color:#1D5560;color:#8FDDE6}
[data-theme="dark"] .bar{background:#453D31}
[data-theme="dark"] .heat .cell{background:#362E25}
[data-theme="dark"] .heat .cell.l1{background:#3A4A34}
[data-theme="dark"] .heat .cell.l2{background:#4A6A40}
[data-theme="dark"] .heat .cell.l3{background:#5E8A50}
[data-theme="dark"] .heat .cell.l4{background:#7FB573}
[data-theme="dark"] .heatkey.l0{background:#362E25}
[data-theme="dark"] .heatkey.l1{background:#3A4A34}
[data-theme="dark"] .heatkey.l2{background:#4A6A40}
[data-theme="dark"] .heatkey.l3{background:#5E8A50}
[data-theme="dark"] .heatkey.l4{background:#7FB573}
[data-theme="dark"] .switch .sl{background:#4A4234}
[data-theme="dark"] .toast{background:var(--head);color:var(--bg)}
[data-theme="dark"] .footer .f-brand img{background:#FAF6EF;border-radius:10px;padding:8px 12px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:'Inter Variable','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55;padding:0 20px 40px}
h1,h2,h3,.serif{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;color:var(--head);font-weight:600}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 8px;flex-wrap:wrap}
.brand{cursor:pointer;background:none;border:none;text-align:left;padding:0}
.brand .b1{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.3rem;color:var(--head);font-weight:700;line-height:1.1}
.brand .b2{font-size:.68rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
nav.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
nav.pills button{border:none;background:transparent;color:var(--body);padding:8px 14px;border-radius:999px;font-size:.92rem;font-weight:500;cursor:pointer;font-family:inherit}
nav.pills button:hover{background:var(--tint)}
nav.pills button.active{background:var(--accent-soft);color:var(--head);font-weight:600}
.search-btn{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:.88rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px}
.search-btn kbd{background:var(--tint);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.72rem;font-family:inherit}
.view{display:none;padding-top:10px}
.view.active{display:block}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px 0 6px}
.view-head h1{font-size:2rem;line-height:1.15}
.view-head .sub{color:var(--muted);margin-top:4px;font-size:.98rem}
.kicker{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 2px 12px var(--shadow);padding:20px;margin:14px 0}
.card h2{font-size:1.3rem;margin-bottom:2px}
.card h3{font-size:1.08rem;margin:0 0 6px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.label{font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px var(--shadow)}
.stat .v{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.6rem;color:var(--head);font-weight:600;margin-top:4px}
.stat .v.teal{color:var(--teal)} .stat .v.green{color:var(--green)} .stat .v.red{color:var(--red)}
.stat .n{font-size:.85rem;color:var(--muted)}
button{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:.93rem;font-weight:600;font-family:inherit}
.btn{background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn-dark{background:var(--head);color:#FAF6EF}
.btn-dark:hover{filter:brightness(1.25)}
.btn2{background:var(--tint);color:var(--head);border:1px solid var(--border)}
.btn2:hover{background:#EBDFC9}
.btn-ghost{background:transparent;color:var(--head);border:1px solid var(--border)}
.btn-sm{padding:6px 11px;font-size:.85rem}
.btn-danger{background:#FBEDE8;color:var(--red)}
.btn-danger:hover{background:#F7DFD7}
.btn:disabled,.btn-dark:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:.87rem;font-weight:600;color:var(--head);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);font-size:1rem;color:var(--body);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent2)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=number]{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.checkrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.92rem}
.checkrow input{margin:0}
.checkrow label{margin:0;font-weight:500}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.bar{height:10px;background:#EEE5D2;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent2);border-radius:99px;transition:width .3s}
.bar>i.teal{background:var(--teal)} .bar>i.over{background:var(--red)} .bar>i.good{background:var(--green)}
.bar>i.needs{background:#7C8B6F}.bar>i.wants{background:#C9A86A}.bar>i.savings{background:#0CA9B5}
.plabel{font-size:.85rem;color:var(--muted);margin-top:5px}
.empty{color:var(--muted);font-style:italic;padding:14px 0;text-align:center}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--head)}
.pill.paid{background:#E3EFE1;color:var(--green)}
.pill.due{background:#FBEDE8;color:var(--red)}
.pill.teal{background:#E0F3F5;color:#0A8A94}
.pill.sage{background:var(--accent-soft);color:var(--head)}
.num{font-variant-numeric:tabular-nums}
.iconbtn{border:none;background:transparent;color:var(--muted);padding:6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--tint);color:var(--head)}
.iconbtn svg{width:18px;height:18px}
.ic{width:20px;height:20px;flex:0 0 20px;color:var(--accent)}
.ic svg{width:100%;height:100%}
/* Paychecks */
.period-nav{display:flex;align-items:center;gap:6px}
.period-nav .pdate{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.15rem;color:var(--head);font-weight:600;min-width:150px;text-align:center}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--head);font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;padding:0}
.chev:hover{background:var(--tint)}
.income-row,.bill-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;margin-top:8px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--body)}
.income-row:hover,.bill-row:hover{background:var(--tint)}
.income-row .nm,.bill-row .nm{font-weight:600;color:var(--head)}
.income-row .dt,.bill-row .dt{font-size:.83rem;color:var(--muted)}
.summary-big{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.summary-big .big{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:2rem;color:var(--head);line-height:1.1}
.summary-lines{font-size:.93rem}
.summary-lines div{display:flex;justify-content:space-between;gap:24px;padding:3px 0}
.summary-lines b{color:var(--head)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:148px;height:148px;border-radius:50%;position:relative;flex:0 0 148px}
.donut::after{content:'';position:absolute;inset:26px;background:var(--card);border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;text-align:center}
.donut-center .dc-v{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.15rem;color:var(--head);font-weight:600}
.donut-center .dc-l{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:0 0 12px}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filter-tabs button{border:1px solid var(--border);background:var(--card);color:var(--body);padding:6px 13px;border-radius:999px;font-size:.87rem;font-weight:600}
.filter-tabs button.active{background:var(--accent-soft);color:var(--head);border-color:var(--accent-soft)}
.env-group{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.env-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--body)}
.env-card:hover{border-color:var(--accent2)}
.env-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.env-card .nm{font-weight:600;color:var(--head);font-size:1rem;display:flex;align-items:center;gap:8px}
.env-card .amt{font-weight:600;color:var(--head);white-space:nowrap}
.env-card .left{font-size:.85rem;color:var(--teal);margin-top:6px;font-weight:600}
.env-card .left.over{color:var(--red)}
.env-card .left.muted{color:var(--muted);font-weight:400}
.notice{background:#E0F3F5;border:1px solid #BDE6EA;color:#0A6E78;border-radius:12px;padding:12px 16px;font-size:.92rem;margin:12px 0}
/* Bills */
.cal-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.cal-day{flex:0 0 64px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:8px 4px;text-align:center;cursor:pointer;font-family:inherit;color:var(--body);min-height:74px}
.cal-day .dow{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.cal-day .dnum{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.2rem;color:var(--head)}
.cal-day .bill{font-size:.68rem;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-day.selected{background:var(--accent-soft);border-color:var(--accent-soft)}
.cal-day.today{border-color:var(--accent2);border-width:2px}
.bill-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--card);cursor:pointer}
.bill-card:hover{border-color:var(--accent2)}
.bill-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bill-card .nm{font-weight:600;color:var(--head);font-size:1rem;display:flex;align-items:center;gap:8px}
.bill-card .amt{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.15rem;color:var(--head);white-space:nowrap}
.bill-card .meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.bill-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
/* Log */
.tx-group{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.tx-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;margin-top:6px;background:var(--card);cursor:pointer;width:100%;text-align:left;font-family:inherit;color:var(--body)}
.tx-row:hover{background:var(--tint)}
.tx-row .tx-nm{font-weight:600;color:var(--head)}
.tx-row .tx-meta{font-size:.83rem;color:var(--muted)}
.tx-row .tx-amt{margin-left:auto;font-weight:700;white-space:nowrap}
.tx-amt.exp{color:var(--red)} .tx-amt.inc{color:var(--green)} .tx-amt.trn{color:var(--head)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.heat .cell{aspect-ratio:1;border-radius:5px;background:#F0EAD9;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--muted)}
.heat .cell.l1{background:#DCE8D4}.heat .cell.l2{background:#B4D0A8}.heat .cell.l3{background:#8AB87E}.heat .cell.l4{background:#5E9455;color:#fff}
.heatkey{display:inline-block;width:10px;height:10px;border-radius:2px}
.heatkey.l0{background:#F0EAD9}.heatkey.l1{background:#DCE8D4}.heatkey.l2{background:#B4D0A8}.heatkey.l3{background:#8AB87E}.heatkey.l4{background:#5E9455}
.heat .cell.today{outline:2px solid var(--head);outline-offset:-2px}
.catbar{margin:8px 0}
.catbar .cb-top{display:flex;justify-content:space-between;font-size:.9rem}
.catbar .cb-top b{color:var(--head)}
/* Funds / Accounts / Debt */
.fund-card,.acct-card,.debt-card{border:1px solid var(--border);border-radius:16px;padding:16px 18px;background:var(--card)}
.fund-card .nm,.acct-card .nm,.debt-card .nm{font-weight:600;color:var(--head);font-size:1.05rem;display:flex;align-items:center;gap:8px}
.fund-card .big,.acct-card .big,.debt-card .big{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.5rem;color:var(--head);margin-top:4px}
.card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sect{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 0 8px}
.toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.toggle button{flex:1;border-radius:0;background:var(--card);color:var(--body);padding:10px 8px;font-size:.88rem}
.toggle button.active{background:var(--accent);color:#fff}
/* Insights */
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.month-tile{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--card);text-align:left;cursor:pointer;font-family:inherit;color:var(--body)}
.month-tile:hover{border-color:var(--accent2)}
.month-tile .mn{font-weight:600;color:var(--head);font-size:.9rem}
.month-tile .ma{font-size:.85rem;color:var(--muted)}
.mile-card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--card);position:relative}
.mile-card .x{position:absolute;top:8px;right:8px}
.mile-card .t{font-weight:600;color:var(--head)}
.mile-card .d{font-size:.85rem;color:var(--muted)}
.cf-bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.cf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cf-col .cf-bar{width:100%;max-width:44px;border-radius:6px 6px 0 0;min-height:3px}
.cf-col .cf-lab{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:center}
.cf-col .cf-val{font-size:.78rem;font-weight:600;color:var(--head)}
/* Settings */
.swatch-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.selected{border-color:var(--head);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--head)}
.env-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-top:6px;background:var(--card);cursor:pointer;width:100%;text-align:left;font-family:inherit;color:var(--body)}
.env-row:hover{background:var(--tint)}
.switch{position:relative;width:44px;height:24px;flex:0 0 44px}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#DDD3BC;border-radius:99px;transition:.2s;cursor:pointer}
.switch .sl:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl:before{transform:translateX(20px)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:520px;margin:40px auto;padding:24px;position:relative}
.modal h2{font-size:1.4rem;margin-bottom:4px}
.modal .m-close{position:absolute;top:14px;right:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal-actions .spacer{margin-right:auto}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.icon-opt{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 0;display:flex;align-items:center;justify-content:center;color:var(--body)}
.icon-opt.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--head)}
.icon-opt svg{width:20px;height:20px}
/* Search palette */
.palette{max-width:560px}
.palette input{font-size:1.05rem;padding:12px 14px}
.pal-group{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-radius:10px;padding:9px 12px;font-size:.95rem;color:var(--body);font-family:inherit}
.pal-item.sel{background:var(--accent-soft);color:var(--head)}
.pal-item .k{margin-left:auto;font-size:.75rem;color:var(--muted)}
.pal-foot{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
/* Toast + footer */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--head);color:#FAF6EF;padding:12px 20px;border-radius:99px;font-size:.92rem;font-weight:600;z-index:100;transition:transform .3s,visibility 0s .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 40px);text-align:center;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .3s,visibility 0s}
.footer{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;padding:26px 10px 8px}
.footer .f-brand{margin-left:auto;text-align:right}
.footer .f-brand img{width:150px;height:auto;display:block;margin-left:auto}
.footer .f-copy{font-size:.78rem;margin-top:4px}
@media print{button,nav.pills,.search-btn,.no-print{display:none!important}body{background:#fff}.view{display:block!important}.card{box-shadow:none;break-inside:avoid}}

/* Demo banner (only shown when DEMO_MODE is true) */
.demo-banner{background:#2B2620;color:#FAF6EF;text-align:center;padding:10px 16px;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-left:-20px;margin-right:-20px}
.demo-banner a{background:#FAF6EF;color:#2B2620;padding:6px 14px;border-radius:99px;font-weight:700;text-decoration:none;font-size:.88rem;white-space:nowrap}
.demo-banner a:hover{background:#fff}

/* ---- Mobile-friendly (v4): responsive layout for phones ---- */
@media(max-width:900px){
.g4{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(2,1fr)}
.month-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:640px){
body{padding:0 12px 32px}
header.top{flex-direction:column;align-items:flex-start;gap:10px}
nav.pills{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}
nav.pills button{flex:0 0 auto}
.view-head h1{font-size:1.6rem}
.g2,.g3,.g4{grid-template-columns:1fr!important}
.summary-big .big{font-size:1.6rem}
.period-nav .pdate{min-width:0;font-size:1rem}
.month-grid{grid-template-columns:repeat(2,1fr)}
.donut{width:120px;height:120px;flex-basis:120px}
.donut::after{inset:21px}
.modal{padding:18px;margin:16px auto}
.demo-banner{margin-left:-12px;margin-right:-12px}
.overlay{padding:10px}
input,select,textarea{font-size:16px}
.icon-grid{grid-template-columns:repeat(6,1fr)}
.cf-bars{gap:8px}
.stat .v{font-size:1.35rem}
}
</style>

function iso(d){var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),da=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+da}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(s){if(!s)return '';var d=parseISO(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtDateShort(s){if(!s)return '';var d=parseISO(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function monthKey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function periodLenDays(){var f=S.settings.frequency;if(f==='weekly')return 7;if(f==='biweekly')return 14;if(f==='monthly')return 30;return 15}
function periodContaining(date){
  var f=S.settings.frequency,anchor=parseISO(S.settings.firstPayday);
  if(f==='semimonthly'){var y=date.getFullYear(),m=date.getMonth();return new Date(y,m,date.getDate()>=15?15:1)}
  if(f==='monthly'){var a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate());var n=(date.getFullYear()-a.getFullYear())*12+(date.getMonth()-a.getMonth());var c=new Date(a.getFullYear(),a.getMonth()+n,Math.min(a.getDate(),28));if(c>date)c=new Date(a.getFullYear(),a.getMonth()+n-1,Math.min(a.getDate(),28));return c}
  var step=f==='weekly'?7:14;var diff=Math.floor((strip(date)-strip(anchor))/86400000);var k=Math.floor(diff/step);return addDays(anchor,k*step);
}
function strip(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function periodEnd(start){
  var f=S.settings.frequency;
  if(f==='semimonthly'){if(start.getDate()===1)return new Date(start.getFullYear(),start.getMonth(),14);return new Date(start.getFullYear(),start.getMonth()+1,0)}
  if(f==='monthly'){var e=new Date(start.getFullYear(),start.getMonth()+1,Math.min(start.getDate(),28));return addDays(e,-1)}
  return addDays(start,(f==='weekly'?7:14)-1);
}
function stepPeriod(start,n){
  var f=S.settings.frequency;
  if(f==='semimonthly'){var y=start.getFullYear(),m=start.getMonth();if(start.getDate()===1){return n>0?new Date(y,m,15):new Date(y,m-1,15)}return n>0?new Date(y,m+1,1):new Date(y,m,1)}
  if(f==='monthly'){return new Date(start.getFullYear(),start.getMonth()+n,Math.min(start.getDate(),28))}
  return addDays(start,n*(f==='weekly'?7:14));
}
function curPeriod(){if(!S.ui.period)S.ui.period=iso(periodContaining(new Date()));return parseISO(S.ui.period)}
function periodLabel(start){var e=periodEnd(start);var a=start.toLocaleDateString('en-US',{month:'short',day:'numeric'});var b=e.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});return a+' – '+b}
function isCurrentPeriod(){return iso(periodContaining(new Date()))===S.ui.period}
function isFuturePeriod(){return parseISO(S.ui.period)>periodContaining(new Date())}

/* ---------- Computed data ---------- */
function incomesInPeriod(start,end){
  return S.incomes.filter(function(i){
    var d=parseISO(i.date);
    if(i.repeats)return d<=end;
    return d>=start&&d<=end;
  });
}
function billOccurrencesIn(start,end){
  // returns [{bill, date}] for each occurrence inside [start,end]
  var out=[];
  S.bills.forEach(function(b){
    var first=parseISO(b.dueDate);var day=first.getDate();
    var m0=new Date(start.getFullYear(),start.getMonth(),1),m1=new Date(end.getFullYear(),end.getMonth(),1);
    for(var m=new Date(m0);m<=m1;m.setMonth(m.getMonth()+1)){
      if(b.frequency==='quarterly'){
        var monthsDiff=(m.getFullYear()-first.getFullYear())*12+(m.getMonth()-first.getMonth());
        if(monthsDiff<0||monthsDiff%3!==0)continue;
      }
      var dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
      var occ=new Date(m.getFullYear(),m.getMonth(),Math.min(day,dim));
      if(occ>=start&&occ<=end&&occ>=strip(first)&&occ>=first)out.push({bill:b,date:occ});
    }
  });
  return out.sort(function(a,b2){return a.date-b2.date});
}
function billsDueThisPeriod(start,end){return billOccurrencesIn(start,end)}
function billsThisMonth(){
  var now=new Date();var s=new Date(now.getFullYear(),now.getMonth(),1);var e=new Date(now.getFullYear(),now.getMonth()+1,0);
  return billOccurrencesIn(s,e);
}
function billPaidIn(bill,periodKey){return bill.paid&&bill.paid[periodKey]}
function envSpent(envId,periodStart,periodEnd){
  var env=S.envelopes.find(function(e){return e.id===envId});if(!env)return 0;
  return S.transactions.reduce(function(sum,t){
    if(t.type!=='expense'||t.category!==env.name)return sum;
    var d=parseISO(t.date);return (d>=periodStart&&d<=periodEnd)?sum+t.amount:sum;
  },0);
}
function envRollover(envId,periodStart){
  var prev=stepPeriod(periodStart,-1);var prevEnd=periodEnd(prev);
  var assigned=(S.assign[iso(prev)]||{})[envId]||0;
  var spent=envSpent(envId,prev,prevEnd);
  return Math.max(0,assigned-spent);
}
function accountBalance(acc){
  var bal=acc.opening||0;
  S.transactions.forEach(function(t){
    if(t.type==='income'&&t.accountId===acc.id)bal+=t.amount;
    if(t.type==='expense'&&t.accountId===acc.id)bal-=t.amount;
    if(t.type==='transfer'){if(t.accountId===acc.id)bal-=t.amount;if(t.toAccountId===acc.id)bal+=t.amount}
  });
  return bal;
}
function accountById(id){return S.accounts.find(function(a){return a.id===id})}
function txInMonth(t,y,m){var d=parseISO(t.date);return d.getFullYear()===y&&d.getMonth()===m}
function spentInMonth(y,m){return S.transactions.reduce(function(s,t){return (t.type==='expense'&&txInMonth(t,y,m))?s+t.amount:s},0)}
function incomeInMonth(y,m){return S.transactions.reduce(function(s,t){return (t.type==='income'&&txInMonth(t,y,m))?s+t.amount:s},0)}
function spentByCategory(y,m){

  S.transactions.forEach(function(t){if(t.type==='expense'&&txInMonth(t,y,m)){map[t.category]=(map[t.category]||0)+t.amount}});
  return map;
}

function paycheckSummary(){
  var start=curPeriod(),end=periodEnd(start),pk=S.ui.period;
  var incs=incomesInPeriod(start,end);
  var income=incs.reduce(function(s,i){return s+i.amount},0);
  var occ=billsDueThisPeriod(start,end);
  var billsTotal=occ.reduce(function(s,o){return s+o.bill.amount},0);
  var assignMap=S.assign[pk]||{};
  var assigned=S.envelopes.reduce(function(s,e){return s+(assignMap[e.id]||0)},0);
  var fundsTotal=fundsPerPaycheck();
  var safe=income-billsTotal-fundsTotal;
  var left=income-billsTotal-assigned;
  return {start:start,end:end,pk:pk,incs:incs,income:income,occ:occ,billsTotal:billsTotal,assigned:assigned,fundsTotal:fundsTotal,safe:safe,left:left};
}
function donutHTML(parts,centerVal,centerLabel){
  var total=parts.reduce(function(s,p){return s+p.v},0);
  var acc=0,cols=[];
  parts.forEach(function(p){
    var pct=total>0?p.v/total*100:0;
    cols.push(p.c+' '+acc.toFixed(1)+'% '+(acc+pct).toFixed(1)+'%');
    acc+=pct;
  });
  var bg=total<=0?'var(--tint)':('conic-gradient('+cols.join(',')+')');
  var leg=parts.map(function(p){
    var pct=total>0?Math.round(p.v/total*100):0;
    return '<span><i class="dot" style="background:'+p.c+'"></i>'+esc(p.l)+' &nbsp;<b>'+pct+'%</b>&nbsp;<span class="num">'+fmt(p.v)+'</span></span>';
  }).join('');
  return '<div class="donut-wrap"><div class="donut" style="background:'+bg+'"><div class="donut-center"><div class="dc-v num">'+centerVal+'</div><div class="dc-l">'+centerLabel+'</div></div></div><div class="legend">'+leg+'</div></div>';
}

function setEnvFilter(f){S.ui.envFilter=f;save();renderPaychecks()}
function stepPeriodNav(n){S.ui.period=iso(stepPeriod(curPeriod(),n));save();renderPaychecks()}
function copyLastPaycheck(){if(demoBlocked())return;
  var prev=stepPeriod(curPeriod(),-1);var prevMap=S.assign[iso(prev)]||{};
  var cur=S.assign[S.ui.period]||{};var copied=0;
  Object.keys(prevMap).forEach(function(id){if(!(id in cur)){cur[id]=prevMap[id];copied++}});
  S.assign[S.ui.period]=cur;refresh();toast(copied?('Copied '+copied+' envelope assignment'+(copied===1?'':'s')+' from last paycheck'):'Nothing to copy from last paycheck');
}
function feedFunds(){if(demoBlocked())return;
  var auto=S.funds.filter(function(f){return f.auto});
  if(!auto.length){toast('No funds set to auto-fund each paycheck');return}
  auto.forEach(function(f){f.saved=(f.saved||0)+f.perPaycheck});
  refresh();toast('Fed '+auto.length+' sinking fund'+(auto.length===1?'':'s')+' — '+fmt(fundsPerPaycheck())+' added');
}
function openHowItWorks(){
  openModal('<h2>How this works</h2><p style="margin-top:8px">One paycheck at a time. Start with your take-home pay, then give every dollar a job: bills first, then envelopes for spending, then your sinking funds.</p><p style="margin-top:10px">The number at the top &mdash; <b>Left to assign</b> &mdash; is the money that still needs a job. Keep it at $0. When it hits $0, every dollar has a job.</p><div class="card" style="margin-top:14px"><div class="label">A worked example</div><div class="summary-lines" style="margin-top:8px"><div><span>Take-home pay</span><b>$2,500</b></div><div><span>Bills</span><b>&minus;$1,400</b></div><div><span>Groceries</span><b>&minus;$400</b></div><div><span>Left to assign</span><b>$700</b></div><div><span>Fun money</span><b>&minus;$100</b></div><div><span>Emergency fund</span><b>&minus;$600</b></div><div><span>Left to assign</span><b style="color:var(--teal)">$0 &mdash; perfect</b></div></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Got it</button></div>');
}

/* ---------- BILLS ---------- */
function renderBills(){
  var now=new Date();
  var monthOcc=billsThisMonth();
  var monthTotal=monthOcc.reduce(function(s,o){return s+o.bill.amount},0);
  var ps=paycheckSummary();
  var dueTotal=ps.billsTotal,dueCount=ps.occ.length;
  var autoBills=S.bills.filter(function(b){return b.autopay});
  var autoTotal=autoBills.reduce(function(s,b){return s+b.amount},0);
  // 15-day calendar strip centered on today
  var stripDays=[];
  for(var i=-7;i<=7;i++){var d=addDays(now,i);var occ=billOccurrencesIn(d,d);stripDays.push({d:d,occ:occ})}
  var selDay=S.ui.calDay;
  var stripHTML='<div class="cal-strip">'+stripDays.map(function(sd){
    var key=iso(sd.d);var isToday=key===iso(now);var isSel=selDay===key;
    var first=sd.occ[0];
    return '<button class="cal-day'+(isSel?' selected':'')+(isToday?' today':'')+'" onclick="selectCalDay(\''+key+'\')"><div class="dow">'+sd.d.toLocaleDateString('en-US',{weekday:'short'})+'</div><div class="dnum">'+sd.d.getDate()+'</div>'+(first?'<div class="bill">'+esc(first.bill.name)+' '+fmt(first.bill.amount)+'</div>':'<div class="bill">&nbsp;</div>')+'</button>';
  }).join('')+'</div>';
  var bills=S.bills.slice().sort(function(a,b){return parseISO(a.dueDate)-parseISO(b.dueDate)});
  var shownBills=selDay?bills.filter(function(b){return billOccurrencesIn(parseISO(selDay),parseISO(selDay)).some(function(o){return o.bill.id===b.id})}):bills;
  var listHTML=shownBills.length?'<div class="grid g2">'+shownBills.map(function(b){
    var paid=Object.keys(b.paid||{}).some(function(k){return b.paid[k]});
    var acc=accountById(b.paidFrom);
    return '<div class="bill-card" onclick="openBillDialog(\''+b.id+'\')"><div class="top"><span class="nm">'+icon(b.icon||'tag')+esc(b.name)+'</span><span class="amt num">'+fmt(b.amount)+'</span></div>'
    +'<div class="meta">'+(b.frequency==='quarterly'?'Quarterly':'Monthly')+' &middot; Due '+fmtDateShort(b.dueDate)+' &middot; '+(acc?('Paid from '+esc(acc.name)):'No account')+'</div>'
    +'<div class="tags"><span class="pill">'+esc(b.category||'General')+'</span>'+(b.autopay?'<span class="pill sage">Autopay</span>':'')+(paid?'<span class="pill paid">Paid</span>':'<span class="pill due">Unpaid</span>')+'</div></div>';
  }).join('')+'</div>':'<p class="empty">'+(selDay?'No bills due on this day.':'No bills yet. Add your first bill to see it here.')+'</p>';
  var unpaidDue=ps.occ.filter(function(o){return !billPaidIn(o.bill,ps.pk)});
  var payAllTotal=unpaidDue.reduce(function(s,o){return s+o.bill.amount},0);
  var html='<div class="view-head"><div><h1>Bills</h1><p class="sub">Every bill, its amount and due date, in one calm list.</p></div>'
    +'<div class="head-actions"><button class="btn btn-sm" onclick="openBillDialog()">+ Bill</button><button class="btn-dark btn-sm" onclick="payAllDue()" '+(payAllTotal>0?'':'disabled')+'>Pay all due '+fmt(payAllTotal)+'</button></div></div>'
    +'<div class="grid g3"><div class="stat"><div class="label">This month</div><div class="v num">'+fmt(monthTotal)+'</div><div class="n">across '+monthOcc.length+' bills</div></div>'
    +'<div class="stat"><div class="label">Due this paycheck</div><div class="v num">'+fmt(dueTotal)+'</div><div class="n">'+dueCount+' bill'+(dueCount===1?'':'s')+'</div></div>'
    +'<div class="stat"><div class="label">On autopay</div><div class="v num">'+fmt(autoTotal)+'</div><div class="n">'+autoBills.length+' bill'+(autoBills.length===1?'':'s')+'</div></div></div>'
    +'<div class="card"><h2>Coming up</h2><p class="sub">Tap a day to see the bills due on it.</p>'+stripHTML+'</div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h2>Your bills</h2>'+(selDay?'<button class="btn2 btn-sm" onclick="selectCalDay(null)">Show all bills</button>':'')+'</div>'+listHTML
    +'<p class="hint" style="margin-top:14px">Bills repeat automatically. Edit one and every future paycheck updates. Pay a bill from the Log to mark it paid.</p></div>';
  document.getElementById('view-bills').innerHTML=html;
}
function selectCalDay(key){S.ui.calDay=(S.ui.calDay===key)?null:key;save();renderBills()}
function payAllDue(){if(demoBlocked())return;
  var ps=paycheckSummary();
  var unpaid=ps.occ.filter(function(o){return !billPaidIn(o.bill,ps.pk)});
  if(!unpaid.length){toast('Nothing due — all bills this paycheck are paid');return}
  var noAcct=unpaid.filter(function(o){return !o.bill.paidFrom||!accountById(o.bill.paidFrom)});
  if(noAcct.length){toast('Add a "Paid from" account to: '+noAcct.map(function(o){return o.bill.name}).join(', '));return}
  unpaid.forEach(function(o){
    S.transactions.push({id:uid(),type:'expense',amount:o.bill.amount,category:o.bill.category||'Bills',accountId:o.bill.paidFrom,date:iso(new Date()),note:o.bill.name});
    o.bill.paid=o.bill.paid||{};o.bill.paid[ps.pk]=true;
  });
  refresh();toast('Paid '+unpaid.length+' bill'+(unpaid.length===1?'':'s')+' — '+fmt(unpaid.reduce(function(s,o){return s+o.bill.amount},0)));
}

/* ---------- LOG ---------- */
function heatmapHTML(y,m){
  var dim=new Date(y,m+1,0).getDate();var first=new Date(y,m,1).getDay();
  var byDay={};
  S.transactions.forEach(function(t){if(t.type==='expense'&&txInMonth(t,y,m)){var d=parseISO(t.date).getDate();byDay[d]=(byDay[d]||0)+t.amount}});
  var max=0;Object.keys(byDay).forEach(function(k){if(byDay[k]>max)max=byDay[k]});
  var cells='';
  for(var i=0;i<first;i++)cells+='<div class="cell"></div>';
  var today=new Date();
  for(var d=1;d<=dim;d++){
    var amt=byDay[d]||0;var lvl=amt<=0?0:(amt<=max*0.25?1:(amt<=max*0.5?2:(amt<=max*0.75?3:4)));
    var isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    cells+='<div class="cell'+(lvl?' l'+lvl:'')+(isToday?' today':'')+'" title="'+monthName(y,m)+' '+d+': '+fmt(amt)+'">'+d+'</div>';
  }
  return '<div class="heat">'+cells+'</div><p class="plabel">Less &nbsp; <span class="heatkey l0"></span> <span class="heatkey l1"></span> <span class="heatkey l2"></span> <span class="heatkey l3"></span> <span class="heatkey l4"></span> &nbsp; More</p>';
}
function renderLog(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var spent=spentInMonth(y,m),inc=incomeInMonth(y,m);
  var byCat=spentByCategory(y,m);
  var topCat='—',topAmt=0;Object.keys(byCat).forEach(function(c){if(byCat[c]>topAmt){topAmt=byCat[c];topCat=c}});
  var daysInMonth=new Date(y,m+1,0).getDate();var dayNum=Math.min(now.getDate(),daysInMonth);
  var dailyAvg=spent/dayNum;
  var highest=0,highestDay='';
  S.transactions.forEach(function(t){if(t.type==='expense'&&txInMonth(t,y,m)){var d=parseISO(t.date);var tot=S.transactions.reduce(function(s2,t2){return (t2.type==='expense'&&t2.date===t.date)?s2+t2.amount:s2},0);if(tot>highest){highest=tot;highestDay=fmtDateShort(t.date)}}});
  var catBars=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).slice(0,6).map(function(c){
    var pct=topAmt>0?Math.round(byCat[c]/topAmt*100):0;
    return '<div class="catbar"><div class="cb-top"><span>'+esc(c)+'</span><b class="num">'+fmt(byCat[c])+'</b></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }).join('')||'<p class="empty">No spending logged this month yet.</p>';
  var q=(S.ui.logSearch||'').toLowerCase(),af=S.ui.logAccount;
  var txs=S.transactions.filter(function(t){
    if(af!=='all'&&t.accountId!==af&&t.toAccountId!==af)return false;
    if(q){var hay=(t.note+' '+t.category+' '+(accountById(t.accountId)?accountById(t.accountId).name:'')).toLowerCase();if(hay.indexOf(q)===-1)return false}
    return true;
  }).sort(function(a,b){return b.date.localeCompare(a.date)});
  var listHTML='';
  if(!txs.length){listHTML='<p class="empty">No entries yet. Log your first expense or income to see it here.</p>'}
  else{
    var lastDate='';
    txs.forEach(function(t){
      if(t.date!==lastDate){lastDate=t.date;listHTML+='<div class="tx-group">'+fmtDate(t.date)+'</div>'}
      var acc=accountById(t.accountId);var toAcc=t.toAccountId?accountById(t.toAccountId):null;
      var cls=t.type==='expense'?'exp':(t.type==='income'?'inc':'trn');
      var sign=t.type==='expense'?'-':(t.type==='income'?'+':'');
      var nm=t.note||t.category;
      var meta=t.type==='transfer'?('Transfer &middot; '+(acc?esc(acc.name):'')+' &rarr; '+(toAcc?esc(toAcc.name):'')):(esc(t.category)+' &middot; '+(acc?esc(acc.name):''));
      listHTML+='<button class="tx-row" onclick="openTxDetail(\''+t.id+'\')"><span><span class="tx-nm">'+esc(nm)+'</span><br><span class="tx-meta">'+meta+'</span></span><span class="tx-amt '+cls+' num">'+sign+fmt(t.amount)+'</span></button>';
    });
  }
  var acctOpts='<option value="all">All accounts</option>'+S.accounts.map(function(a){return '<option value="'+a.id+'"'+(af===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('');
  var html='<div class="view-head"><div><h1>Log</h1><p class="sub">Every dollar in and out, one line at a time.</p></div>'
    +'<div class="head-actions"><button class="btn-dark btn-sm" onclick="openTxDialog(\'expense\')">Expense</button><button class="btn btn-sm" onclick="openTxDialog(\'income\')">Income</button><button class="btn btn-sm" onclick="openTxDialog(\'transfer\')">Transfer</button></div></div>'
    +'<div class="grid g4"><div class="stat"><div class="label">Spent this month</div><div class="v num">'+fmt(spent)+'</div></div>'
    +'<div class="stat"><div class="label">Top category</div><div class="v" style="font-size:1.25rem">'+esc(topCat)+'</div><div class="n num">'+fmt(topAmt)+'</div></div>'
    +'<div class="stat"><div class="label">Daily average</div><div class="v num">'+fmt(dailyAvg)+'</div></div>'
    +'<div class="stat"><div class="label">In &minus; Out</div><div class="v num '+(inc-spent>=0?'green':'red')+'">'+fmt(inc-spent)+'</div></div></div>'
    +'<div class="grid g2"><div class="card"><h2>Daily spending</h2>'+heatmapHTML(y,m)+'<p class="plabel">Daily average <b class="num">'+fmt(dailyAvg)+'</b>'+(highestDay?' &middot; Highest day <b class="num">'+fmt(highest)+' '+highestDay+'</b>':'')+'</p></div>'
    +'<div class="card"><h2>By category</h2>'+catBars+'</div></div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h2>'+txs.length+' entries</h2><div class="row" style="min-width:280px;flex:0 1 420px"><input type="search" placeholder="Search" value="'+esc(S.ui.logSearch)+'" oninput="S.ui.logSearch=this.value;save();renderLog()" style="margin:0"><select onchange="S.ui.logAccount=this.value;save();renderLog()" style="margin:0">'+acctOpts+'</select></div></div>'+listHTML+'</div>';
  document.getElementById('view-log').innerHTML=html;
}

/* ---------- FUNDS ---------- */

    +'<div class="card-actions"><button class="btn2 btn-sm" onclick="openGoalDialog(\''+g.id+'\')">Edit</button><button class="btn btn-sm" onclick="openAddMoneyDialog(\'goal\',\''+g.id+'\')">Add money</button></div></div>';
  }).join('')+'</div>':'<p class="empty">No savings goals yet. Set one and watch it grow.</p>';

function deleteFund(id){if(demoBlocked())return;var f=S.funds.find(function(x){return x.id===id});if(!f)return;if(confirm('Delete fund "'+f.name+'"?')){S.funds=S.funds.filter(function(x){return x.id!==id});refresh();toast('Fund deleted')}}
function deleteGoal(id){if(demoBlocked())return;var g=S.goals.find(function(x){return x.id===id});if(!g)return;if(confirm('Delete goal "'+g.name+'"?')){S.goals=S.goals.filter(function(x){return x.id!==id});refresh();toast('Goal deleted')}}

/* ---------- ACCOUNTS ---------- */
function renderAccounts(){
  var groups=[['Cash & savings',['checking','savings','cash']],['Investments',['investment']],['Credit',['credit','loan']]];
  var total=0,totals={};
  S.accounts.forEach(function(a){var b=accountBalance(a);total+=b});

function deleteAccount(id){
  if(demoBlocked())return false;
  var a=accountById(id);if(!a)return false;
  var used=S.transactions.some(function(t){return t.accountId===id||t.toAccountId===id})||S.bills.some(function(b){return b.paidFrom===id});
  if(used){alert('This account is used by transactions or bills. Remove those first, or edit them to use another account.');return false}
  if(confirm('Delete account "'+a.name+'"?')){S.accounts=S.accounts.filter(function(x){return x.id!==id});refresh();toast('Account deleted');return true}
  return false;
}

/* ---------- DEBT ---------- */
function simulateDebt(){
  var debts=S.debts.filter(function(d){return d.balance>0});
  if(!debts.length)return {months:0,interest:0,paidOff:{},totalOwed:0};
  var method=S.debt.method,extra=S.debt.extra||0;
  var sim=debts.map(function(d){return {id:d.id,bal:d.balance,apr:d.apr,min:d.min}});
  var order=sim.slice().sort(function(a,b){return method==='snowball'?(a.bal-b.bal):(b.apr-a.apr)});
  var totalInterest=0,months=0,paidOff={};
  var guard=0;
  while(sim.some(function(d){return d.bal>0.005})&&guard<1200){
    guard++;months++;
    sim.forEach(function(d){if(d.bal>0){var intr=d.bal*(d.apr/100)/12;d.bal+=intr;totalInterest+=intr}});
    sim.forEach(function(d){if(d.bal>0){var pay=Math.min(d.min,d.bal);d.bal-=pay}});
    var extraLeft=extra;
    for(var i=0;i<order.length&&extraLeft>0;i++){
      var d=order[i];if(d.bal>0.005){var pay=Math.min(extraLeft,d.bal);d.bal-=pay;extraLeft-=pay}
    }
    sim.forEach(function(d){if(d.bal<=0.005&&!paidOff[d.id])paidOff[d.id]=months});
    // if no progress is possible (minimums below interest), stop
    if(months>1&&extra===0&&sim.every(function(d){return d.min<=0}))break;
  }
  var now=new Date();
  var dates={};
  Object.keys(paidOff).forEach(function(id){var dt=new Date(now.getFullYear(),now.getMonth()+paidOff[id],1);dates[id]=dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})});
  var freeBy=new Date(now.getFullYear(),now.getMonth()+months,1);
  return {months:months,interest:totalInterest,paidOff:dates,freeBy:freeBy.toLocaleDateString('en-US',{month:'long',year:'numeric'}),totalOwed:debts.reduce(function(s,d){return s+d.balance},0)};
}
function renderDebt(){
  var sim=simulateDebt();
  var totalOwed=S.debts.reduce(function(s,d){return s+d.balance},0);
  var totalStart=S.debts.reduce(function(s,d){return s+(d.start||d.balance)},0);
  var paidOff=totalStart-totalOwed;
  var progress=totalStart>0?Math.round(paidOff/totalStart*100):0;
  var mins=S.debts.reduce(function(s,d){return s+d.min},0);
  var cleared=S.debts.filter(function(d){return d.balance<=0}).length;
  var cards=S.debts.length?'<div class="grid g-auto">'+S.debts.slice().sort(function(a,b){
    return S.debt.method==='snowball'?(a.balance-b.balance):(b.apr-a.apr);
  }).map(function(d,idx){
    var pct=d.start>0?Math.min(100,Math.round((d.start-d.balance)/d.start*100)):0;
    return '<div class="debt-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><span class="nm">'+icon(d.icon||'card')+esc(d.name)+'</span><span>'+(idx===0&&d.balance>0?'<span class="pill teal">Focus</span> ':'')+'<button class="iconbtn" onclick="openDebtDialog(\''+d.id+'\')" aria-label="Edit debt">✎</button><button class="iconbtn" onclick="deleteDebt(\''+d.id+'\')" aria-label="Delete debt">✕</button></span></div>'
    +'<div class="big num">'+fmt(d.balance)+' <span style="font-size:1rem;color:var(--muted)">of '+fmt(d.start||d.balance)+' start</span></div>'
    +'<div class="bar" style="margin-top:8px"><i class="good" style="width:'+pct+'%"></i></div><p class="plabel">'+pct+'% paid off</p>'
    +'<p class="plabel">'+d.apr+'% APR &middot; min '+fmt(d.min)+(sim.paidOff[d.id]?' &middot; paid off '+sim.paidOff[d.id]:'')+'</p>'
    +'<div class="card-actions"><button class="btn btn-sm" onclick="openDebtPaymentDialog(\''+d.id+'\')">Log payment</button><button class="btn2 btn-sm" onclick="openDebtDialog(\''+d.id+'\')">Edit</button></div></div>';
  }).join('')+'</div>':'<p class="empty">No debts listed. Add one to build your payoff plan.</p>';
  var html='<div class="view-head"><div><div class="kicker">A plan to get free</div><h1>Debt</h1><p class="sub">List each balance you owe with its interest rate (APR) and minimum payment. Pick a payoff method and add any extra you can each month, and we project the date you are debt-free.</p></div>'
    +'<div class="head-actions"><button class="btn btn-sm" onclick="openDebtDialog()">+ Add debt</button></div></div>'
    +'<div class="card"><div class="summary-big"><div><div class="label">Debt-free by</div><div class="big serif">'+(S.debts.length?sim.freeBy:'—')+'</div><div class="plabel">'+(S.debts.length?sim.months+' months at this pace &middot; '+fmt(sim.interest)+' interest':'Add a debt to see your projection')+'</div></div>'
    +'<div style="flex:1;min-width:220px"><div class="label">Paid off so far</div><div class="big num">'+fmt(paidOff)+' <span style="font-size:1.1rem;color:var(--muted)">of '+fmt(totalStart)+'</span></div><div class="bar" style="margin-top:8px"><i class="good" style="width:'+progress+'%"></i></div><p class="plabel">'+progress+'% progress</p></div></div>'
    +'<div class="grid g2" style="margin-top:18px"><div><div class="label">Payoff method</div><div class="toggle" style="margin-top:6px"><button class="'+(S.debt.method==='snowball'?'active':'')+'" onclick="setDebtMethod(\'snowball\')">Snowball<br><span style="font-weight:400;font-size:.8rem">Smallest balance first, quick wins</span></button><button class="'+(S.debt.method==='avalanche'?'active':'')+'" onclick="setDebtMethod(\'avalanche\')">Avalanche<br><span style="font-weight:400;font-size:.8rem">Highest rate first, least interest</span></button></div></div>'
    +'<div><label style="margin-top:0">Extra monthly payment</label><div class="row"><input type="number" min="0" step="0.01" value="'+(S.debt.extra||0)+'" onchange="S.debt.extra=num(this.value);refresh()" style="max-width:160px"><span class="hint" style="margin:0">on top of minimums</span></div></div></div></div>'
    +'<div class="grid g4"><div class="stat"><div class="label">Total owed</div><div class="v num">'+fmt(totalOwed)+'</div></div>'
    +'<div class="stat"><div class="label">Minimums / mo</div><div class="v num">'+fmt(mins)+'</div></div>'
    +'<div class="stat"><div class="label">Cleared</div><div class="v num">'+cleared+'/'+S.debts.length+'</div></div>'
    +'<div class="stat"><div class="label">Progress</div><div class="v num">'+progress+'%</div></div></div>'
    +'<div class="card"><h2>Your debts</h2>'+cards+'<p class="hint" style="margin-top:14px">The date is an estimate from today\'s balances, rates and payments. Log payments to keep it accurate.</p></div>';
  document.getElementById('view-debt').innerHTML=html;
}

/* ---------- INSIGHTS ---------- */
function renderInsights(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  var spent=spentInMonth(y,m),inc=incomeInMonth(y,m);
  var ps=paycheckSummary();
  var rate=inc>0?Math.max(0,Math.round((inc-spent)/inc*100)):0;
  var byCat=spentByCategory(y,m);
  var grp={needs:0,wants:0,savings:0};
  Object.keys(byCat).forEach(function(c){grp[groupOfCategory(c)]+=byCat[c]});
  var savingsAmt=Math.max(0,inc-spent);
  var tot=grp.needs+grp.wants+grp.savings+savingsAmt;
  var nPct=tot>0?Math.round(grp.needs/tot*100):0,wPct=tot>0?Math.round(grp.wants/tot*100):0,sPct=tot>0?Math.round((grp.savings+savingsAmt)/tot*100):0;
  var catDonut=donutHTML(Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).slice(0,6).map(function(c,i){
    var cols=['#7C8B6F','#C9A86A','#0CA9B5','#B86B7A','#5B8DB8','#8B7BB8'];
    return {l:c,v:byCat[c],c:cols[i%cols.length]};
  }),fmt(spent),'spent');
  // Net cash flow: last 6 months
  var months=[];
  for(var i=5;i>=0;i--){var dt=new Date(y,m-i,1);months.push({y:dt.getFullYear(),m:dt.getMonth(),label:dt.toLocaleDateString('en-US',{month:'short'})})}
  var flows=months.map(function(mm){return {label:mm.label,net:incomeInMonth(mm.y,mm.m)-spentInMonth(mm.y,mm.m)}});
  var maxFlow=Math.max.apply(null,flows.map(function(f){return Math.abs(f.net)}).concat([1]));
  var cfHTML='<div class="cf-bars">'+flows.map(function(f){
    var h=Math.max(3,Math.round(Math.abs(f.net)/maxFlow*110));
    return '<div class="cf-col"><div class="cf-val num">'+fmt(f.net)+'</div><div class="cf-bar" style="height:'+h+'px;background:'+(f.net>=0?'var(--accent2)':'var(--red)')+'"></div><div class="cf-lab">'+f.label+'</div></div>';
  }).join('')+'</div>';
  // Spending trend line (SVG)
  var trend=months.map(function(mm){return spentInMonth(mm.y,mm.m)});
  var maxT=Math.max.apply(null,trend.concat([1]));
  var pts=trend.map(function(v,i){var x=20+i*(440/5);var yy=110-(v/maxT*90);return x+','+yy}).join(' ');
  var dots=trend.map(function(v,i){var x=20+i*(440/5);var yy=110-(v/maxT*90);return '<circle cx="'+x+'" cy="'+yy+'" r="4" fill="var(--accent)"/><text x="'+x+'" y="'+(yy-10)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+fmt(v)+'</text>'}).join('');
  var labels=months.map(function(mm,i){var x=20+i*(440/5);return '<text x="'+x+'" y="130" font-size="10" text-anchor="middle" fill="var(--muted)">'+mm.label+'</text>'}).join('');
  var trendSVG='<svg viewBox="0 0 480 140" style="width:100%;height:auto"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+labels+'</svg>';
  // Year in view
  var yearHTML='<div class="month-grid">'+months.map(function(){return ''}).join('')+Array.apply(null,Array(12)).map(function(_,mi){
    var s=spentInMonth(y,mi);var mx=Math.max.apply(null,Array.apply(null,Array(12)).map(function(_,k){return spentInMonth(y,k)}).concat([1]));
    return '<button class="month-tile" onclick="go(\'log\')"><div class="mn">'+monthName(y,mi)+'</div><div class="ma num">'+fmt(s)+'</div><div class="bar" style="margin-top:6px;height:6px"><i style="width:'+Math.round(s/mx*100)+'%"></i></div></button>';
  }).join('')+'</div>';
  var miles=S.milestones.length?'<div class="grid g-auto">'+S.milestones.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(ms){
    return '<div class="mile-card"><button class="iconbtn x" onclick="deleteMilestone(\''+ms.id+'\')" aria-label="Remove milestone">✕</button><div class="t">'+esc(ms.title)+'</div><div class="d">'+fmtDate(ms.date)+(ms.note?' &middot; '+esc(ms.note):'')+'</div></div>';
  }).join('')+'</div>':'<p class="empty">No milestones yet. Add one when something goes right.</p>';
  var html='<div class="view-head"><div><h1>Insights</h1><p class="sub">See where the money goes, and how the plan is holding up.</p></div></div>'
    +'<div class="grid g4"><div class="stat"><div class="label">Spending this month</div><div class="v num">'+fmt(spent)+'</div></div>'
    +'<div class="stat"><div class="label">Income this month</div><div class="v num">'+fmt(inc)+'</div></div>'
    +'<div class="stat"><div class="label">Safe to spend</div><div class="v num">'+fmt(ps.safe)+'</div></div>'
    +'<div class="stat"><div class="label">Savings rate</div><div class="v num">'+rate+'%</div></div></div>'
    +'<div class="grid g2"><div class="card"><h2>50/30/20 balance</h2><p class="sub">Needs '+nPct+'% (target '+S.settings.targets.needs+'%) &middot; Wants '+wPct+'% (target '+S.settings.targets.wants+'%) &middot; Savings '+sPct+'% (target '+S.settings.targets.savings+'%)</p>'
    +'<div style="display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--tint)"><div style="width:'+nPct+'%;background:var(--accent)"></div><div style="width:'+wPct+'%;background:#C9A86A"></div><div style="width:'+sPct+'%;background:var(--teal)"></div></div>'
    +'<p class="hint">Needs are running '+(nPct>S.settings.targets.needs?'high':'in line')+' this month. The goal is awareness, not perfection.</p></div>'
    +'<div class="card"><h2>Spending by category</h2>'+(Object.keys(byCat).length?catDonut:'<p class="empty">No spending logged this month yet.</p>')+'</div></div>'
    +'<div class="grid g2"><div class="card"><h2>Net cash flow</h2><p class="sub">Income minus spending, by month</p>'+cfHTML+'</div>'
    +'<div class="card"><h2>Spending trend</h2><p class="sub">Last 6 months</p>'+trendSVG+'</div></div>'
    +'<div class="card"><h2>Daily spending</h2>'+heatmapHTML(y,m)+'</div>'
    +'<div class="card"><h2>Year in view &mdash; '+y+'</h2>'+yearHTML+'</div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2>Milestones</h2><button class="btn btn-sm" onclick="openMilestoneDialog()">+ Add milestone</button></div>'+miles+'</div>';
  document.getElementById('view-insights').innerHTML=html;
}

}

function openDebtPaymentDialog(id){

function saveDebtPayment(ev,id){if(demoBlocked())return false;

function openEnvelopeDialog(id){

function saveEnvelope(ev,id){if(demoBlocked())return false;
  ev.preventDefault();
  var name=document.getElementById('fEnvName').value.trim();
  if(!name){alert('Please enter a name.');return false}
  var data={name:name,amount:num(document.getElementById('fEnvAmt').value),category:document.getElementById('fEnvCat').value,icon:document.getElementById('fEnvIcon').value};
  if(id){Object.assign(S.envelopes.find(function(x){return x.id===id}),data)}
  else S.envelopes.push(Object.assign({id:uid()},data));
  closeModal();refresh();toast('Envelope saved');return false;
}
function deleteEnvelope(id){if(demoBlocked())return;
  var e=S.envelopes.find(function(x){return x.id===id});if(!e)return;
  if(confirm('Delete envelope "'+e.name+'"? Its assignments will be removed too.')){
    S.envelopes=S.envelopes.filter(function(x){return x.id!==id});
    Object.keys(S.assign).forEach(function(pk){delete S.assign[pk][id]});
    closeModal();refresh();toast('Envelope deleted');
  }
}

/* ---------- Search palette (Ctrl+K) ---------- */
var PAL_COMMANDS=[];
function palCommands(){
  var cmds=[];
  VIEWS.forEach(function(v){cmds.push({group:'Go to',label:v[1],hint:'View',run:function(){go(v[0])}})});
  [['Add expense',function(){openTxDialog('expense')}],['Add income',function(){openIncomeDialog()}],['Add bill',function(){openBillDialog()}],['Add transfer',function(){openTxDialog('transfer')}],['Add fund',function(){openFundDialog()}],['Add goal',function(){openGoalDialog()}],['Add account',function(){openAccountDialog()}],['Add debt',function(){openDebtDialog()}],['Add milestone',function(){openMilestoneDialog()}]].forEach(function(c){cmds.push({group:'Add',label:c[0],hint:'Create',run:c[1]})});
  cmds.push({group:'Other',label:'Install app',hint:'Guide',run:function(){openInstallDialog()}});
  cmds.push({group:'Other',label:'Restore backup',hint:'Settings',run:function(){go('settings');setTimeout(function(){restoreClick()},100)}});
  cmds.push({group:'Other',label:'Back up my data',hint:'Settings',run:function(){exportJSON()}});
  return cmds;
}
var palSel=0,palFiltered=[];
function openPalette(){
  PAL_COMMANDS=palCommands();palFiltered=PAL_COMMANDS;palSel=0;
  document.getElementById('palBox').innerHTML='<input id="palInput" type="search" placeholder="Search or type a command..." autocomplete="off" oninput="palFilter(this.value)"><div id="palResults"></div><div class="pal-foot">&uarr;&darr; Navigate &middot; &crarr; Select &middot; Esc Close</div>';
  document.getElementById('palOverlay').classList.add('open');
  palRender();
  var inp=document.getElementById('palInput');inp.focus();
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palFiltered.length-1,palSel+1);palRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palRender()}
    else if(e.key==='Enter'){e.preventDefault();palRun(palSel)}
  });
}
function palFilter(q){
  q=q.toLowerCase();
  palFiltered=PAL_COMMANDS.filter(function(c){return c.label.toLowerCase().indexOf(q)>-1||c.group.toLowerCase().indexOf(q)>-1});
  palSel=0;palRender();
}
function palRender(){
  var h='',lastGroup='';
  if(!palFiltered.length)h='<p class="empty">No matching commands.</p>';
  palFiltered.forEach(function(c,i){
    if(c.group!==lastGroup){lastGroup=c.group;h+='<div class="pal-group">'+c.group+'</div>'}
    h+='<button class="pal-item'+(i===palSel?' sel':'')+'" onclick="palRun('+i+')"><span>'+esc(c.label)+'</span><span class="k">'+c.hint+'</span></button>';
  });
  document.getElementById('palResults').innerHTML=h;
}
function palRun(i){
  var c=palFiltered[i];if(!c)return;
  closePalette();c.run();
}
function closePalette(){document.getElementById('palOverlay').classList.remove('open')}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(document.getElementById('palOverlay').classList.contains('open'))closePalette();else openPalette()}
});
